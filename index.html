<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/static/Inter-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/static/Inter-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/static/Inter-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: Inter;
      }

      body {
        height: 100vh;
        width: 100vw;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      .container {
        height: 36rem;
        width: 20rem;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        background-color: hsl(0, 0%, 12%);
        border-radius: 12px;
      }

      .info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .image {
        height: 5.625rem;
        width: 5.625rem;
        margin-bottom: 1.5rem;
      }

      img {
        width: 100%;
        border-radius: 50%;
      }

      .name {
        margin-bottom: 8px;
        font-size: 1.5rem;
      }

      .city {
        font-size: 14px;
        font-weight: 600;
        color: hsl(75, 94%, 57%);
      }

      .prof {
        margin: 1.5rem 0;
        font-size: 14px;
        font-weight: 400;
      }

      .social {
        height: 18rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      .social-btn {
        display: flex;
        height: 2.75rem;
        width: 16.5rem;
        justify-content: center;
        align-items: center;
        color: white;
        background-color: hsl(0, 0%, 20%);
        border-radius: 10px;
        box-shadow: 2px 2px rgba(0, 0, 0, 0.1);
        text-decoration: none;
      }

      .social-btn:hover {
        color: black;
        background-color: hsl(75, 94%, 57%);
        transition: background-color 0.5s;
      }

      @media screen and (min-width: 768px) {
        .container {
          height: 38rem;
          width: 24rem;
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <!-- Info -->
        <div class="info">
          <div class="image">
            <img src="assets/images/avatar-jessica.jpeg" alt="avatar jessica" />
          </div>
          <span class="name">Jessica Randall</span>
          <span class="city">London, United Kingdom</span>
          <span class="prof">"Front-end developer and avid reader."</span>
        </div>
        <!-- Social -->
        <div class="social">
          <a href="#" class="social-btn"><span id="gitbub">GitHub</span></a>
          <a href="#" class="social-btn"
            ><span id="frontmentor">Frontend Mentor</span></a
          >
          <a href="#" class="social-btn"><span id="linkedin">LinkedIn</span></a>
          <a href="#" class="social-btn"><span id="twitter">Twitter</span></a>
          <a href="#" class="social-btn"
            ><span id="instagram">Instagram</span></a
          >
        </div>
      </div>
    </div>
  </body>
</html>
